server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /styles.css {
        try_files /styles.css =404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location / {
        return 404;
    }
}
