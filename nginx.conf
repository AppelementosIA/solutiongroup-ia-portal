map $args $login_has_callback {
    default 0;
    ~(^|&)(code|error)(=|&|$) 1;
}

map $arg_state $login_module_target {
    default /orcamentos/login;
    ~^documental\. /documental/api/auth/microsoft/callback;
    "" /;
}

map "$login_has_callback:$arg_state" $login_is_valid {
    default 1;
    ~^0: 0;
    ~^1:$ 0;
}

map $login_is_valid $login_target {
    0 /;
    1 $login_module_target;
}

map $login_is_valid $login_forward_query {
    0 "";
    1 $is_args$args;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /styles.css {
        try_files /styles.css =404;
    }

    location = /login {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 $login_target$login_forward_query;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location / {
        return 404;
    }
}
