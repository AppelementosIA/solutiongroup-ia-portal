<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solution Group IA</title>
    <meta
      name="description"
      content="Portal raiz da Solution Group IA para acesso aos módulos de implantação."
    >
    <link rel="icon" href="/assets/solutiongroup-ia-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="portal" aria-label="Portal Solution Group IA">
      <section class="portal-panel">
        <img
          class="brand-mark"
          src="/assets/solutiongroup-ia-mark.svg"
          alt=""
          width="72"
          height="72"
          aria-hidden="true"
        >
        <h1>Solution Group IA</h1>
        <p class="lead">Portal de implantação de inteligência artificial em preparação.</p>

        <nav class="module-links" aria-label="Módulos disponíveis">
          <a class="module-link" href="/orcamentos/">
            <span>Acessar módulo de orçamentos</span>
            <span class="link-icon" aria-hidden="true">-&gt;</span>
          </a>
          <a class="module-link" href="/relatorios/">
            <span>Acessar módulo de relatórios</span>
            <span class="link-icon" aria-hidden="true">-&gt;</span>
          </a>
          <a class="module-link" href="/documental">
            <span>Acessar Copiloto Documental</span>
            <span class="link-icon" aria-hidden="true">-&gt;</span>
          </a>
          <a class="module-link" href="https://ia.solutiongroup.com.br/erosao">
            <span>Acessar APP de relatório de erosão</span>
            <span class="link-icon" aria-hidden="true">-&gt;</span>
          </a>
          <a class="module-link" href="/gestao-ia">
            <span>Acessar gestão central de custos de IA</span>
            <span class="link-icon" aria-hidden="true">-&gt;</span>
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
